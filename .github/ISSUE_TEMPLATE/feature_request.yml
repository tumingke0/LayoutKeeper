name: 功能建议 / Feature request
description: 想要的新功能或改进 / Ideas and improvements
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？ / What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / Proposed solution
